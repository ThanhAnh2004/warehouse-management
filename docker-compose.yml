version: '3.8'

services:
  # RabbitMQ Broker for Message Bus
  rabbitmq:
    image: rabbitmq:3-management
    container_name: warehouse_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - wms_network

  # NestJS Services
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.nest
      args:
        APP_NAME: api-gateway
    container_name: warehouse_api_gateway
    ports:
      - "8000:8000"
    depends_on:
      - identity-service
      - inventory-service
      - transaction-service
      - notification-service
      - reporting-service
    env_file: .env.docker
    volumes:
      - ./public/uploads:/app/public/uploads
    networks:
      - wms_network

  identity-service:
    build:
      context: .
      dockerfile: Dockerfile.nest
      args:
        APP_NAME: identity-service
    container_name: warehouse_identity_service
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env.docker
    networks:
      - wms_network

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile.nest
      args:
        APP_NAME: inventory-service
    container_name: warehouse_inventory_service
    ports:
      - "8002:8002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env.docker
    networks:
      - wms_network

  transaction-service:
    build:
      context: .
      dockerfile: Dockerfile.nest
      args:
        APP_NAME: transaction-service
    container_name: warehouse_transaction_service
    ports:
      - "8003:8003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env.docker
    networks:
      - wms_network

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.nest
      args:
        APP_NAME: notification-service
    container_name: warehouse_notification_service
    ports:
      - "3004:3004"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env.docker
    networks:
      - wms_network

  reporting-service:
    build:
      context: .
      dockerfile: Dockerfile.nest
      args:
        APP_NAME: reporting-service
    container_name: warehouse_reporting_service
    ports:
      - "3005:3005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - inventory-service
      - transaction-service
      - forecasting-service
    env_file: .env.docker
    networks:
      - wms_network

  # Python Services - Tiền xử lý dữ liệu & AI Forecast
  data-processing-service:
    build:
      context: ./apps/data-processing-service
      dockerfile: Dockerfile
    container_name: warehouse_data_processing_service
    ports:
      - "8005:8005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env.docker
    networks:
      - wms_network

  forecasting-service:
    build:
      context: ./apps/forecasting-service
      dockerfile: Dockerfile
    container_name: warehouse_forecasting_service
    ports:
      - "8004:8004"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - data-processing-service
    env_file: .env.docker
    networks:
      - wms_network

  # React Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: warehouse_frontend
    ports:
      - "5173:80"
    expose:
      - "80"
    networks:
      - wms_network

  # NGINX Reverse Proxy
  reverse-proxy:
    image: nginx:alpine
    container_name: warehouse_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - frontend
      - forecasting-service
      - data-processing-service
    networks:
      - wms_network

networks:
  wms_network:
    driver: bridge

volumes:
  rabbitmq_data:
